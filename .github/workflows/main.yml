name: main
on: push
jobs:
  Test:
    runs-on: ubuntu-latest
    container: golang:1.26-alpine
    steps:
      - name: Clone down repository
        uses: actions/checkout@v7
      - name: Run frontend tests
        run: cd frontend && go test

  Security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Clone down repository
        uses: actions/checkout@v7

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,misconfig'
          format: 'sarif'
          output: 'trivy.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '1'
          version: 'latest'

      - name: Install Semgrep
        run: python3 -m pip install --disable-pip-version-check semgrep

      - name: Semgrep Scan
        run: |
          semgrep scan \
            --config .semgrep/ \
            --config r/javascript.browser.security.insecure-innerhtml.insecure-innerhtml \
            --metrics off \
            --sarif --output semgrep.sarif \
            --error \
            frontend/ backend/

      - name: Upload Trivy Results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: 'Trivy'

      - name: Upload Semgrep Results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: 'Semgrep'

  CodeQL:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Clone down repository
        uses: actions/checkout@v7

      - name: Setup GoLang
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual

      - name: Build Modules
        run: |
          (cd backend && go build ./...)
          (cd frontend && go build ./...)

      - name: CodeQL Analyze
        uses: github/codeql-action/analyze@v4

  Build:
    needs: [Test, Security, CodeQL]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Setup GoLang
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Login to GitHub Container Registry
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Clone down repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - parallel:
          - name: Build backend
            uses: docker/build-push-action@v7
            with:
              push: ${{ github.ref == 'refs/heads/main' }}
              context: backend
              tags: |
                ghcr.io/hlvm04/simple-fortune-cookie/backend:latest
                ghcr.io/hlvm04/simple-fortune-cookie/backend:${{ github.sha }}
          - name: Build frontend
            uses: docker/build-push-action@v7
            with:
              push: ${{ github.ref == 'refs/heads/main' }}
              context: frontend
              tags: |
                ghcr.io/hlvm04/simple-fortune-cookie/frontend:latest
                ghcr.io/hlvm04/simple-fortune-cookie/frontend:${{ github.sha }}

  FunctionalTest:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: [Build]
    steps:
      - name: Clone down repository
        uses: actions/checkout@v7
      - name: Set up Kubeconfig
        uses: azure/setup-kubectl@v4
      - name: Deploy and test temporary version
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
          KUBE_NAMESPACE: student-67
        run: |
          set -eu
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$KUBECONFIG"
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test_backend="cookie-backend-test-${suffix}"
          test_frontend="cookie-frontend-test-${suffix}"
          manifests=$(mktemp -d)
          cp k8s/*.yml "$manifests"
          sed -i \
            -e "s|cookie-backend|${test_backend}|g" \
            -e "s|cookie-frontend|${test_frontend}|g" \
            -e "s|:latest|:${GITHUB_SHA}|g" \
            "$manifests"/*.yml

          port_forward_pid=
          trap 'kill "$port_forward_pid" 2>/dev/null || true; kubectl -n "$KUBE_NAMESPACE" delete -f "$manifests" --ignore-not-found --wait=false || true' EXIT
          
          kubectl -n "$KUBE_NAMESPACE" apply -f "$manifests"
          kubectl -n "$KUBE_NAMESPACE" \
            rollout status "deployment/${test_frontend}" --timeout=180s

          kubectl -n "$KUBE_NAMESPACE" \
            port-forward "service/${test_frontend}" 8080:8080 >/dev/null 2>&1 &
          port_forward_pid=$!
          ./scripts/smoke-test.sh http://127.0.0.1:8080

  Deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: [Build, Test, FunctionalTest]
    steps:
      - name: Clone down repository
        uses: actions/checkout@v7
      - name: Set up Kubeconfig
        uses: azure/setup-kubectl@v4
      - name: Deploy to Kubernetes
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
          sed -i "s|:latest|:${{ github.sha }}|" \
            k8s/cookie-backend-deployment.yml \
            k8s/cookie-frontend-deployment.yml
          kubectl --kubeconfig kubeconfig --namespace student-67 apply -f k8s
