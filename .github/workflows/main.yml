name: main
on: push
jobs:
  Test:
    runs-on: ubuntu-latest
    container: golang:1.26-alpine
    steps:
      - name: Clone down repository
        uses: actions/checkout@v7
      - name: Run frontend tests
        run: cd frontend && go test

  Build:
    needs: [Test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Setup GoLang
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Login to GitHub Container Registry
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Clone down repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - parallel:
          - name: Build backend
            uses: docker/build-push-action@v7
            with:
              push: ${{ github.ref == 'refs/heads/main' }}
              context: backend
              tags: |
                ghcr.io/hlvm04/simple-fortune-cookie/backend:latest
                ghcr.io/hlvm04/simple-fortune-cookie/backend:${{ github.sha }}
          - name: Build frontend
            uses: docker/build-push-action@v7
            with:
              push: ${{ github.ref == 'refs/heads/main' }}
              context: frontend
              tags: |
                ghcr.io/hlvm04/simple-fortune-cookie/frontend:latest
                ghcr.io/hlvm04/simple-fortune-cookie/frontend:${{ github.sha }}
