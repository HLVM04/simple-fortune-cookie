services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      REDIS_DNS: redis
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      BACKEND_DNS: backend
  redis:
    image: redis:8.10-alpine
    container_name: redis
    volumes:
      - redis_data:/data

volumes:
  redis_data:
